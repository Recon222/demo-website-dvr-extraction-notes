\r
## Review Priorities\r
\r
### CRITICAL — Security\r
\r
- **XSS in generated HTML** — the demo generates court-style documents as HTML strings in `engine/logic/pdf/*` (`generateCaseNotesDoc`, `generateTimeOffsetDoc`) and renders them in `ui/chrome/PdfPreview.tsx`. Visitor-typed values (case number, names, addresses, notes, DVR fields, imported free text) concatenated into those templates without escaping are a CRITICAL. Check `engine/logic/pdf/shared.ts` for the escape helper and verify every new interpolation uses it.\r
- **Server secret reaching the client bundle** — `OLLAMA_API_KEY` is read only in `app/api/extract/route.ts` (server). Any move of that read into a client module, or a rename to `NEXT_PUBLIC_*`, is CRITICAL. `NEXT_PUBLIC_MAPBOX_TOKEN` is public **by design** (documented in `.env.example`, restricted by URL in the Mapbox dashboard) — not a finding.\r
- **Route-handler guard bypass** — `app/api/extract/route.ts` runs, in order: `content-length` cap (`MAX_BODY_BYTES`), `isAllowedOrigin`, `isRateLimited`, then JSON parse. Reordering these so parsing/upstream work happens before the caps, or a new route handler with no guards, is a finding — the proxy spends a paid budget.\r
- **Untrusted model output treated as trusted** — `/api/extract` returns the model's **raw** reply. Everything downstream (`parseNormalizeMap`) must treat it as hostile input: no `eval`, no unbounded recursion, no direct DOM injection, no prototype-pollution-prone merge (`__proto__`/`constructor` keys from parsed JSON).\r
- **`dangerouslySetInnerHTML` / `srcdoc` with unescaped input** — trace the value to its source before accepting.\r
\r
### HIGH — Type Safety\r
\r
- **`any` without justification.** Use `unknown` + narrowing. `unknown` itself is fine — only flag `any`.\r
- **`as` casts that bypass checks** — casting to an unrelated type to silence an error. Fix the type instead.\r
- **Non-null assertion abuse** — `value!` with no preceding guard.\r
- **Discriminated-union `default:` fall-through** that silently swallows a new variant. This repo prefers exhaustive-by-construction handling — see the `FallbackMode` notice switch in `DemoExperience.tsx` (commented "Exhaustive by construction (review M2)").\r
- **`isolatedModules` violations** — a type re-exported without `export type`.\r
- **Weakening `tsconfig.json`** — call it out explicitly if the diff touches it.\r
\r
### HIGH — Async Correctness\r
\r
- **Unhandled promise rejections** — `async` work started in an event handler without `await` + try/catch or a `.catch()`. Note `deferred.md §18` already tracks "async import handlers carry no top-level `.catch()`" — don't re-file it, but **do** flag a *new* handler repeating the pattern.\r
- **Stale async results written to state after a newer run started.** This is a live, hard-won pattern here: `DemoExperience.tsx` uses an `importGen` ref as a **generation token** — each run captures its own generation and re-checks it after every `await` (there is an explicit re-check after the geocode await, commit `0945fd8`). A shared boolean is documented as insufficient. New async flows that write to the store after an await **must** carry an equivalent token check.\r
- **`array.forEach(async fn)`** — does not await. Use `for...of` + `await`, or `Promise.all`.\r
- **`Promise.all` where partial tolerance is wanted** — one rejection discards the rest. `Promise.allSettled` is the partial-tolerance shape.\r
- **`setState` after unmount** — effects/timers must gate on a cleanup flag. `DemoExperience` clears its `syncTimer` on unmount; new timers need the same.\r
\r
### HIGH — Error Handling\r
\r
- **Swallowed errors** — empty `catch {}` with no surface. **Exception, established and correct:** a per-entry `try/catch` that *counts and surfaces* rather than hiding — see `create-store.ts` `generateExtractedScopes`, which skips non-canonical scopes, increments `dropped`, sets `extractedScopesPartial: true`, and dev-warns. That is the pattern to hold new code to.\r
- **`JSON.parse` without try/catch** — throws on bad input; the import pipeline parses model output.\r
- **Throwing non-`Error` values** — always `throw new Error(...)` or a typed subclass (`PdfExtractionError` is the in-repo example, `ui/import/pdf-extract.ts`).\r
- **`catch (e)` then losing the type** — narrow with `e instanceof Error ? e : new Error(String(e))` before use. `run-import.ts` and `runPdfImport` both do this correctly.\r
- **Console discipline** — production `console.error`/`console.warn` are *used deliberately* here as operator breadcrumbs: `extract-client.ts` warns on non-503 failures (added by a prior review, "otherwise 'every import shows the fallback notice' is undebuggable"), `route.ts` errors on upstream failure, `generateExtractedScopes` dev-warns behind `process.env.NODE_ENV !== 'production'`. **Do not flag these.** Flag a stray `console.log` left in production code.\r
\r
### HIGH — Architecture Compliance (project hard rules)\r
\r
| Rule | Detection |\r
|---|---|\r
| **Store bridge** | `useStore` outside `ui/DemoExperience.tsx` ✗. A screen/modal/control importing a store *instance* ✗. Type-only + pure-selector imports ✓. |\r
| **Engine purity** | React import, `'use client'`, or module-scope `window`/`document` under `features/demo/engine/**` ✗. |\r
| **Single barrel** | `@/features/demo/ui/...` or `@/features/demo/engine/...` imported from `app/`, `components/`, `lib/` ✗. |\r
| **Marketing↔demo isolation** | Any `features/demo` import in `components/**`, `app/(default)/**`, `lib/**` ✗ **(CRITICAL)**. |\r
| **Registry-derived ordering** | Hand-typed step numbers, or a parallel order array duplicating `WIZARD_SCREENS`/`CHAPTERS` ✗. |\r
| **Determinism seam** | `Date.now()`/`Math.random()` in id generation, React keys, or render scope ✗. Injected clock / default param / event-scope read ✓. |\r
| **Demo styling** | Tailwind `className` inside `features/demo/ui/**` ✗. Inline `CSSProperties` there ✓. |\r
| **Lifted prototype styles** | Re-tidying the lifted pixel values or the `404 = 378 + 13×2` device math ✗ — load-bearing, documented in `features/demo/AGENTS.md`. |\r
| **Path alias** | Relative `../../` climbing out of a directory ✗ — use `@/`. |\r
| **`as any`** | Never acceptable. |\r
\r
### MEDIUM — React / Hooks\r
\r
- **Missing/incorrect `useEffect` deps** causing stale closures.\r
- **State mutation** instead of returning new objects. The Zustand store is consistently immutable (`{ ...l, form: { ...l.form, ... } }`) — new actions must match.\r
- **`key={index}`** in a dynamic list. Every list entity here already carries a monotonic `id`.\r
- **`useEffect` for derived state** — compute during render instead.\r
- **Cleanup gaps** — timers, listeners, `AbortController`s, object URLs, map instances. `MapCanvas` lazily imports `mapbox-gl` and must dispose its map; new browser-resource holders need the same.\r
- **Mutating a ref during render** — legitimate here and deliberately used (the `prevViewRef`/`dirRef` "previous prop" pattern in `DemoExperience.tsx`, with a comment explaining why no effect is used). Don't flag the established instances; do flag a new one that mutates a ref used *by other consumers* during render.\r
- **`Number.isFinite` guards** on numeric values parsed from external sources (model output, imported text, coordinates) before downstream math.\r
\r
### MEDIUM — Best Practices\r
\r
- **Magic numbers/strings** that belong in the content registries (`engine/content/*`) or a named constant.\r
- **Deep optional chaining with no fallback** — `a?.b?.c` with no `??`.\r
- **Naming** — camelCase values, PascalCase types/components.\r
- **Dead exports** — a new export on `engine/index.ts` with no consumer.\r
\r
