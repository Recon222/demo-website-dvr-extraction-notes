\r
## Common False Positives — Skip These\r
\r
- **"Inline styles should be Tailwind"** (inside `features/demo/ui/**`) — inline `CSSProperties` IS the convention there.\r
- **"These lifted pixel values look arbitrary"** — they're verbatim from the prototype and load-bearing.\r
- **"Add a branded UUID / validate ids"** — no UUID brand exists; ids are monotonic counter strings by design.\r
- **"Persist this to storage"** — persistence is decision D2 / package P0.4, not yet landed.\r
- **"Add Zod validation"** — only for genuinely new untrusted boundaries, and only if hand-rolled parsing is absent. The engine's parse layer is deliberately hand-rolled.\r
- **"Use `useMemo` / `useCallback` here"** — only with a measured re-render problem or a stable-ref-in-deps bug. Speculative memoization is noise (and it's `web-reviewer`'s lane anyway).\r
- **"Should use Suspense / TanStack Query / React Compiler / Storybook"** — none are used here.\r
- **"`unknown` should be a concrete type"** — `unknown` + narrowing is correct; only flag `any`.\r
- **"`console.warn` should be removed"** — deliberate operator breadcrumbs, several added by prior reviews.\r
- **"Missing tests"** — `test-analyzer`'s lane.\r
- **"Performance / re-renders / bundle / a11y / CSS"** — `web-reviewer`'s lane.\r
- **"Errors are swallowed"** — `silent-failure-hunter`'s lane unless it's a plain empty `catch {}` you can prove loses a real failure; prefer to leave it to that lane.\r
- **Pre-existing tracked items** — `docs/code-reviews/deferred.md` entries (e.g. §15 pre-existing silent-failure backlog, §18 async handler `.catch()`, §5 string-based `updateField` paths). Don't re-file; only flag if this diff makes one materially worse.\r
- **Placeholder screens** — `mediaCapture` / `audioRecording` fall through to a `placeholder`; documented as deferred fast-follows, not bugs.\r
\r
When tempted to flag, ask: "Would a senior engineer on this team actually change this?" If no, skip.\r
\r
---\r
\r
## Severity → Verdict Rubric\r
\r
- **CRITICAL** — Bug, data loss, security hole (XSS in a generated document, server secret exposed, marketing↔demo bundle breach, guard bypass on the paid proxy).\r
- **HIGH** — Real bug under realistic input, type-checker says wrong, violates a documented hard rule (store bridge, engine purity, single barrel, registry ordering, determinism seam).\r
- **MEDIUM** — Real issue, limited blast radius.\r
- **LOW** — Style / nit. Skip unless it teaches something.\r
\r
**Approval:**\r
- Any CRITICAL → **BLOCK**\r
- Any HIGH (no CRITICAL) → **REVISE**\r
- Only MEDIUM / LOW → **APPROVE with comments**\r
- Zero findings → **APPROVE**\r
\r
