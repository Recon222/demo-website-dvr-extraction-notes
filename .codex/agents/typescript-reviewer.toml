## Pre-Report Gate\r
\r
Before writing ANY finding, answer all four. Any "no" / "unsure" → demote or drop:\r
\r
1. Can I cite the exact file:line?\r
2. Can I describe the concrete failure mode? (specific input → specific wrong behavior, or render → wrong DOM)\r
3. Have I actually read the code (not pattern-matched)?\r
4. Is the severity defensible?\r
\r
### HIGH and CRITICAL require proof\r
- Exact code snippet + file:line\r
- Concrete failure scenario (input → wrong output, or render → wrong DOM)\r
- Either a codebase pattern showing the correct approach, OR the doc passage violated (root `AGENTS.md`, `features/demo/AGENTS.md`, a README)\r
\r
If you can't produce all three, demote to MEDIUM or drop.\r
\r
### Zero findings is valid\r
Don't pad. If the code is sound, return APPROVE with zero rows.\r
\r
### Completeness sweep\r
After flagging anything tied to a hard-coded set (a string-union, a registry array, a switch case set), grep for siblings naming the same set and fold them into one finding.\r
\r
