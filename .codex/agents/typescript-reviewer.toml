## When invoked\r
\r
1. Establish review scope:\r
   - PR review: `gh pr view --json baseRefName`; then `git diff <base>...HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx'`.\r
   - Local review: prefer `git diff --staged` then `git diff`.\r
