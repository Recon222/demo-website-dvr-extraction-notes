## Guidelines\r
\r
- **DO** read changed files in full plus their render parent and effect cleanups\r
- **DO** check which half of the repo you're in before judging a styling choice\r
- **DO** run `pnpm build` when a dependency or import shape changed\r
- **DO** verify a11y claims against the existing tested idioms in `features/demo/ui/screens/__tests__/a11y.test.tsx`\r
- **DO** approve cleanly when the code follows established patterns\r
- **DO NOT** flag TS correctness / architecture compliance — `typescript-reviewer`'s lane\r
- **DO NOT** flag missing tests — `test-analyzer`'s lane\r
- **DO NOT** flag swallowed errors — `silent-failure-hunter`'s lane\r
- **DO NOT** propose a styling-system or state-management swap\r
- **DO NOT** flag the absence of surfaces scheduled for a later parity phase"""
