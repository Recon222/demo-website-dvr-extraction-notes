## Diagnostic Commands\r
\r
```bash\r
pnpm build 2>&1 | tail -40                       # route table + First Load JS per route\r
grep -rn "features/demo" components app/\\(default\\) lib   # the wall\r
grep -rn "await import(" features                # confirm heavy deps stay lazy\r
grep -rn "createObjectURL\\|addEventListener\\|setInterval\\|setTimeout" <changed-files>\r
pnpm test --silent <changed-path>\r
```\r
\r
`pnpm build` is the authoritative bundle check when a dependency or import shape changed; skip it for small, obviously-local changes rather than blocking. `node_modules` may be absent in a fresh worktree — `pnpm install --frozen-lockfile` first, or report the gate as unverified.\r
\r
