\r
## Review Priorities\r
\r
### CRITICAL — Bundle & Boundary\r
\r
- **Marketing imports `@/features/demo`** (any import form) — ships `mapbox-gl` + `pdfjs-dist` + `motion` to every marketing page.\r
- **Marketing chrome hoisted into `app/layout.tsx`** — leaks onto the chrome-free `/demo` route.\r
- **A heavy dependency moved from a lazy `await import` to a static top-level import** — specifically `mapbox-gl` in `MapCanvas` or `pdfjs-dist` in `pdf-extract`. Both are deliberately lazy; static-importing either pulls it into the demo's initial chunk.\r
- **`'use client'` added to a marketing layout or a large server component** — converts a server-rendered subtree into client JS. The `(default)` layout being a server component is test-guarded.\r
- **A new dependency added to `package.json` without a bundle rationale** when a lighter path exists, or a barrel import that defeats tree-shaking (`import * as X from 'big-lib'`).\r
\r
### CRITICAL — Resource Leaks\r
\r
- **A `mapbox-gl` `Map` created without a `map.remove()` in cleanup**, or markers added without removal. The existing effect is the reference pattern.\r
- **Object URLs (`URL.createObjectURL`) never revoked** — relevant the moment media capture lands; each leaked URL pins its blob for the page's lifetime.\r
- **Event listener / observer / timer / `AbortController` without teardown.** `usePhoneScale` (resize), `useReducedMotion` (matchMedia `change`), and `DemoExperience`'s `syncTimer` are the in-repo reference patterns.\r
- **`await import`ed module retained across unmount** while the effect that created it has already torn down — check the `mounted` flag pattern in `MapCanvas`.\r
\r
### HIGH — Render Performance\r
\r
| Issue | Symptom |\r
|---|---|\r
| **New state lifted into `DemoExperience`** | It is the single store bridge and already holds a large amount of state; every `useStore` subscription there re-renders the whole phone subtree. New state that only one screen needs belongs in that screen (it's presentational, not stateless). Flag additions to the bridge that have a single consumer. |\r
| **Non-selective store subscription** | `useStore(store, (s) => s.x)` ✓ — one selector per slice of state, as the bridge does today. `useStore(store)` (whole-state) ✗ — re-renders on every action. |\r
| **Selector returning a fresh object/array each call** | `useStore(store, (s) => s.items.map(...))` creates a new reference every run and defeats the equality check. Derive after subscribing, or memoize. |\r
| **Unstable prop identity into a memoized child** | A new inline object/array/callback prop passed to a `React.memo` component defeats the memo. Only flag when the child is actually memoized or the subtree is expensive (map, PDF preview, terminal log list). |\r
| **Callback identity forcing expensive rebuilds** | The map's marker sync is the documented case — a fresh `onMarkerPress` identity would rebuild every marker, so it's held in a live ref. New effects keyed on callback identity need the same treatment. |\r
| **Work done during render that belongs in an event/effect** | Parsing, date math over a whole list, or building large HTML strings inline in JSX. |\r
| **Unvirtualized long list** | Relevant for the import terminal log (P1.3/P1.4 caps the bus at 400 lines) and media libraries. Flag lists that can grow unbounded and render a heavy node per row — not short bounded lists. |\r
| **Layout thrash** | Reading layout (`offsetHeight`, `getBoundingClientRect`) and writing styles in the same synchronous pass; `scrollIntoView` in a loop. |\r
| **Animating non-composited properties** | Animate `transform`/`opacity` (as `screenVariants` does). Animating `width`/`height`/`top`/`left` per frame causes layout on every tick. |\r
| **Image without dimensions** | `next/image` static imports give `StaticImageData` with intrinsic size — a raw `<img>` without width/height causes CLS. |\r
\r
### HIGH — Browser-API Correctness\r
\r
- **Browser globals at module scope** — `window` / `document` / `navigator` read at import time breaks SSR and the build. Must live in an effect or an event handler. (`usePhoneScale` reads `window.innerHeight` inside the effect for exactly this reason.)\r
- **Capability check missing** — `matchMedia`, `clipboard`, `mediaDevices`, `geolocation` are all absent or restricted in some browsers and in jsdom. Feature-detect before calling.\r
- **Permission result assumed granted** — `getUserMedia` / `geolocation` reject or return `denied`; the denied path must be visible to the visitor. The demo's honesty convention (see the `FallbackMode` notices) means a fallback must *say* it's a fallback.\r
- **`fetch` without an abort/timeout on a user-facing path** — the server route wires an `AbortController` with a floored timeout; new client fetches on interactive paths should be cancellable on unmount.\r
- **`next/dynamic` without `ssr: false` for a browser-only module** — the demo mounts this way on purpose.\r
- **Hydration mismatch** — rendering a value that differs between server and client (clock, random, `window`-derived) in a component that does SSR. Note the marketing `useReducedMotion` deliberately SSRs `false` and swaps post-mount; that tradeoff is accepted and documented.\r
\r
### HIGH — Accessibility\r
\r
The repo has real, tested a11y idioms — hold new UI to them rather than inventing a different vocabulary:\r
\r
- **Dialogs:** `role="dialog"` + `aria-modal="true"` + an accessible name, and **Escape closes**. `ModalShell` in `ui/screens/_shared.tsx` is the reference; `screens/__tests__/a11y.test.tsx` pins it. A new overlay that traps the visitor with no Escape/close is a finding.\r
- **Focus management:** a modal/sheet/drawer that opens must move focus into itself and restore it on close; focus must not be left on an unmounted node. Flag new overlays with no focus handling.\r
- **Switches:** `role="switch"` + `aria-checked` + Enter/Space `keyDown` handling — see `Toggle` and the DVR-DST toggle, both pinned by tests.\r
- **Named landmarks:** every `<nav>` needs an accessible name (WCAG 2.4.1). A prior review found the footer `<nav>` unlabeled while the others were labeled — don't repeat it.\r
- **Interactive elements must be real controls:** `<button type="button">` is the in-repo idiom. A `<div onClick>` with no `role`, `tabIndex`, or key handling is a finding.\r
- **Icon-only controls need `aria-label`** (the OCR capture button uses `aria-label="Capture"`); decorative graphics get `aria-hidden` (used 45× in the repo).\r
- **Live regions:** `aria-live` + `role="status"` are already used for async status. New async status that only appears visually is a finding.\r
- **Keyboard reachability of custom widgets** — the repo has `combobox`/`listbox`/`option`, `menu`/`menuitemradio`, `checkbox` roles in the pickers; new ones must be arrow-key navigable and Escape-dismissible.\r
- **Contrast / colour-only signalling** — `deferred.md §23` already tracks "drawer completion dots distinguish complete/partial by colour only." Don't re-file it; do flag a *new* colour-only state signal.\r
\r
### MEDIUM — CSS & Style Discipline\r
\r
- **Wrong half's convention** — a Tailwind `className` inside `features/demo/ui/**`, or a raw `style={{...}}` in a marketing component where a utility class exists.\r
- **Restyling lifted prototype rules** or altering the device-frame math without justification.\r
- **Hard-coded colour literals in marketing** where a Case-File token (`--color-ink-*`, `--color-carolina`, …) exists.\r
- **Class-string interpolation instead of `cn()`** when both strings can set the same property.\r
- **New global CSS not scoped** — `demo.css` rules must stay under `[data-demo-root]`.\r
- **New keyframes duplicating an existing one** in `style.css` / `demo.css`.\r
- **A `prefers-reduced-motion` gap** on a new animation.\r
\r
### MEDIUM — Next.js Idioms\r
\r
- **Route handler missing `runtime` / `dynamic` declarations** where the existing one sets them deliberately (`app/api/extract/route.ts` sets `runtime = 'nodejs'`, `dynamic = 'force-dynamic'`).\r
- **`generateStaticParams` / `generateMetadata` / `notFound()`** — the feature routes use these correctly; new dynamic routes should follow.\r
- **Client component doing work that belongs on the server** (content shaping from `lib/content/*`).\r
- **`next/font` bypassed** — fonts are exposed as CSS variables (`--font-inter`, `--font-nacelle`, `--font-stmono`, `--font-jbmono`) on `<body>`. A runtime `@import` of a Google Font in CSS is a known gap scheduled for parity package P1.1 — don't re-file it, but don't add a new one.\r
- **`next/image` bypassed** for a bundled asset — static imports give `StaticImageData`.\r
\r
