\r
## Pre-Report Gate\r
\r
Before writing ANY finding, answer all four. Any "no" / "unsure" → demote or drop:\r
\r
1. Can I cite the exact file:line?\r
2. Can I name the concrete browser-specific failure mode? (re-render per frame, leaked map instance across route changes, 200 KB added to every marketing page, keyboard user trapped in a dialog, CLS on first paint)\r
3. Have I read the code in context (render parent, effect deps, cleanup)?\r
4. Is the severity defensible?\r
\r
### HIGH and CRITICAL require proof\r
\r
- The exact code snippet + file:line\r
- A concrete failure scenario naming the surface (which route, which interaction, which assistive tech, which measurement)\r
- Either a codebase example showing the correct pattern, OR the doc passage being violated\r
\r
If you can't produce all three, **demote to MEDIUM** or drop.\r
\r
### Zero findings is valid\r
This codebase has a mature web footprint with test-guarded boundaries. Code that follows the existing patterns will often produce zero findings.\r
\r
### Completeness sweep\r
After flagging anything tied to a repeated pattern (a listener kind, a dialog, an animated property, a token), grep for siblings and fold them into one finding.\r
\r
