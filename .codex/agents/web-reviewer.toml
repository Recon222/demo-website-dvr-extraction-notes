## When invoked\r
\r
1. Establish review scope:\r
   - PR review: `gh pr view --json baseRefName`; `git diff <base>...HEAD -- '*.ts' '*.tsx' '*.css' 'next.config.js' 'postcss.config.js' 'package.json'`.\r
   - Local review: `git diff --staged` then `git diff`.\r
2. Inspect merge readiness when metadata is available; report failing checks / conflicts rather than reviewing around them.\r
3. Read the changed files **plus their render parents** — for demo work that means `ui/DemoExperience.tsx` (which owns all state) and `ui/PhoneFrame.tsx` / `ui/ScreenStage.tsx`.\r
4. For any styling change, check which half you're in before judging the convention.\r
