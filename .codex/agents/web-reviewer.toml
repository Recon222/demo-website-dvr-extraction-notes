\r
## Common False Positives — Skip These\r
\r
- **"Inline styles should be Tailwind"** in `features/demo/ui/**` — that IS the convention.\r
- **"These pixel values are magic"** — lifted verbatim from the prototype; the 404 = 378 + 13×2 math is load-bearing and test-pinned.\r
- **"Add `useMemo`/`useCallback` here"** — only with a real re-render problem in a memoized child or an expensive subtree. Speculative memoization is noise.\r
- **"`NEXT_PUBLIC_MAPBOX_TOKEN` is exposed"** — public by design, documented, URL-restricted.\r
- **"`mapbox-gl` / `pdfjs-dist` bloat the bundle"** — already lazy-loaded inside effects/functions. Only flag if a change makes one static.\r
- **"The `exhaustive-deps` disable is a bug"** — the `MapCanvas` create-map effect omits `onReady` deliberately, with a comment. Flag only *undocumented* disables.\r
- **"Should use a CSS-in-JS library / styled-components / CSS Modules"** — not this repo's system.\r
- **"Should add a `tailwind.config.js`"** — Tailwind v4 here is CSS-first by design.\r
- **"Should use Suspense / streaming / React Compiler / Storybook"** — none are used.\r
- **"Add camera / geolocation / storage handling"** — not built yet; scheduled parity phases. Don't demand them.\r
- **"The demo should be server-rendered"** — it is deliberately `ssr: false`.\r
- **"Missing tests"** — `test-analyzer`'s lane.\r
- **"This error is swallowed"** — `silent-failure-hunter`'s lane.\r
- **"This type is wrong"** — `typescript-reviewer` / `type-design-analyzer` lanes.\r
- **Pre-existing tracked items** in `docs/code-reviews/deferred.md` (§19 double-Escape closing both a modal and its picker, §20 z-index inversion between PickerSheet and WizardDrawer, §21 PdfPreview has no Escape/backdrop dismiss, §23 colour-only dots) — don't re-file; flag only if this diff makes one materially worse.\r
\r
When tempted to flag, ask: "Would a senior web engineer on this team actually change this?" If no, skip.\r
\r
---\r
\r
## Severity → Verdict Rubric\r
\r
- **CRITICAL** — Ships the demo's heavy deps into marketing bundles, leaks chrome onto `/demo`, breaks SSR/build, or leaks a browser resource on every mount/unmount cycle.\r
- **HIGH** — Real browser-specific bug under realistic use: re-render storm on an interactive path, a keyboard/screen-reader user cannot complete a flow, a browser API used without its guard, a measurable bundle regression on a shared route.\r
- **MEDIUM** — Idiomatic web concern with limited blast radius, a styling-convention breach, or a contained a11y gap.\r
- **LOW** — Nit / micro-optimization. Skip unless it teaches something.\r
\r
**Approval:**\r
- Any CRITICAL → **BLOCK**\r
- Any HIGH (no CRITICAL) → **REVISE**\r
- Only MEDIUM / LOW → **APPROVE with comments**\r
- Zero findings → **APPROVE**\r
\r
