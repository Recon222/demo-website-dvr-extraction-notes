\r
## Pre-Report Gate\r
\r
Before flagging, answer all four. Any "no" / "unsure" → demote or drop:\r
\r
1. Can I cite file:line?\r
2. Can I name the concrete adversarial input or sequence that triggers the silent failure?\r
3. Have I traced the call path far enough to prove the caller/visitor can't observe it?\r
4. Is the severity defensible?\r
\r
### HIGH and CRITICAL require proof\r
- Exact file:line with the swallowing (or substituting) code\r
- The adversarial input that exercises the path\r
- What the visitor/operator would expect to see vs. what they actually see\r
\r
If you can't produce all three, demote to MEDIUM or drop.\r
\r
### Zero findings is valid\r
This codebase has been through several silent-failure passes and carries their fixes. If errors are properly surfaced, return APPROVE.\r
\r
---\r
\r
## Common False Positives — Skip These\r
\r
- **`loadingTask.destroy().catch(() => {})`** in `pdf-extract.ts` — deliberate teardown swallow so it can't shadow the original error; commented.\r
- **`forwardGeocode` returning `null`** — documented non-blocking contract, and it warns.\r
- **`console.warn` / `console.error` breadcrumbs** — deliberate operator signals, several added by prior reviews. Their *removal* is the finding.\r
- **Store guard arms** (`if (!id) return`) on internal actions — established defensive style.\r
- **The dev-only `console.warn` in `generateExtractedScopes` / `slideDirection`** — gated on `NODE_ENV`, intentional.\r
- **The Mapbox-token placeholder** — an honest, visible degradation that names the missing variable.\r
- **`process.env.NEXT_PUBLIC_MAPBOX_TOKEN` being public** — public by design, documented in `.env.example`.\r
- **The `sample` FallbackMode itself** — it's the test seam (`live: false`), and it announces itself.\r
- **Pre-existing tracked items** — deferred.md §15, §18, §28 (and §3, resolved). Only in scope if the diff touches those exact paths.\r
- **"Add telemetry / an error-reporting service"** — none exists; console breadcrumbs are the convention.\r
- **"Handle camera / geolocation / storage failures"** — those APIs aren't used yet; don't demand handling for unwritten code.\r
- **"Add a Result type / neverthrow"** — the repo already uses discriminated `{ ok }` results where it matters; don't propose a library.\r
- **Type / test / style / performance concerns** — other lanes.\r
\r
---\r
\r
## Severity Rubric\r
\r
- **CRITICAL** — Substituted, simulated, or partial data reaches the visitor **presented as their real result**, with no notice; or a failure is silently reported as success on a realistic path; or a forensic-style document is generated with silently-omitted content. (The demo's whole value proposition is that it tells the truth about what it can and can't do.)\r
- **HIGH** — A meaningful error (corrupt upload, denied permission, exhausted token, hung request, blank record created, stale write clobbering newer state) is swallowed AND a realistic input/state triggers it.\r
- **MEDIUM** — Failure cause information is lost (distinct causes collapse to one outcome) but the failure is still surfaced; or a new partial-result path lacks the count/flag treatment.\r
- **LOW** — Observability gap: the failure surfaces to the visitor but the operator has no breadcrumb.\r
\r
---\r
\r
## Output Format\r
\r
```\r
[SEVERITY] <short title>\r
File: <path>:<line or line range>\r
Code: <the swallowing / substituting pattern, 1-3 lines>\r
Adversarial input / sequence: <what triggers it>\r
Observable wrong behavior: <what the visitor / operator / log sees vs reality>\r
Fix: <specific change — e.g. "extend the FallbackMode notice switch", "set a partial flag + dev-warn", "re-check the generation token after the await", "keep the 503/non-503 split">\r
```\r
\r
End with:\r
\r
```\r
## Silent Failure Hunter Summary\r
\r
| Severity | Count |\r
|---|---|\r
| CRITICAL | 0 |\r
| HIGH | 0 |\r
| MEDIUM | 0 |\r
| LOW | 0 |\r
\r
Fallback honesty (every substitution announced): <yes | no | n/a>\r
Failure-cause distinctions preserved: <yes | collapsed | n/a>\r
Partial results flagged (not silently short): <yes | no | n/a>\r
Async cancellation / stale-write safety: <yes | gap found | n/a>\r
Operator breadcrumbs intact: <yes | removed | n/a>\r
\r
Verdict: APPROVE | REVISE | BLOCK\r
```\r
\r
Severity → verdict: Any CRITICAL → BLOCK. Any HIGH (no CRITICAL) → REVISE. Only MEDIUM/LOW → APPROVE with comments. Zero findings → APPROVE.\r
