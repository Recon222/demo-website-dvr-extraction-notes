\r
- **DO** trace adversarial inputs end-to-end before flagging\r
- **DO** ask of every fallback: "does the visitor know this isn't their real result?"\r
- **DO** check `git log` / blame before calling a `console.warn` noise — several were added by prior reviews as the only diagnostic signal\r
- **DO** verify cleanup runs on all unmount / error / cancel branches\r
- **DO** check `docs/code-reviews/deferred.md` before filing — and note when a diff has fired a tracked item's un-defer trigger\r
- **DO** approve cleanly when error handling is solid\r
- **DO NOT** flag style, typing, test, or performance issues — other lanes\r
- **DO NOT** suggest a refactor where a `console.warn` + a state flag would close the gap\r
- **DO NOT** flag deliberate best-effort discards on genuinely non-actionable teardown\r
- **DO NOT** relitigate documented architectural decisions (store bridge, engine purity, inline styles, keyless-by-design import)"""
