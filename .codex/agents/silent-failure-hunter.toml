\r
## Inputs You Receive\r
\r
- A list of changed files (`*.ts`, `*.tsx`, config)\r
- A pointer to project rules (root `AGENTS.md`, `features/demo/AGENTS.md`, `docs/code-reviews/deferred.md`)\r
- Pre-flight gate status (a `tsc` error in the changeset often indicates a type lying about runtime)\r
- For fix-delta passes: a pointer to your previous review and the commits to verify\r
\r
## Your Process\r
\r
### 1. Identify Error and Degradation Surfaces\r
Read every changed file. Note every place that:\r
- Catches an exception (`try/catch`, `.catch()`)\r
- Returns `null` / `undefined` / `''` / `[]` on failure\r
- Fires and forgets (`void asyncFn()`, an un-awaited promise in a handler)\r
- Uses `Promise.all` / `Promise.allSettled`\r
- **Substitutes fallback content** (sample data, placeholder, cached value, default) for a real result\r
- Calls a browser API that can be absent, denied, or rate-limited\r
- Holds a resource that must be released (map instance, object URL, listener, timer, abort controller)\r
- Writes to the store after an `await`\r
\r
### 2. Trace the Failure Path\r
For each surface, trace what the *caller and the visitor* see when it fires:\r
- Is the error preserved with its cause, or coalesced into one indistinct outcome?\r
- **Does the visitor learn that what they're looking at is not their real result?**\r
- Can the operator debug it — is there a breadcrumb (`console.warn`/`console.error`) or a distinct status code?\r
- Could the swallowed failure propagate into a silent-corruption state (blank location created, NaN coordinate, half-populated form, stale state written over new)?\r
- Does the handling tell the truth about *which* thing failed, or generalize to a catch-all?\r
\r
### 3. Apply the Silent-Failure Patterns\r
\r
#### Repo-specific (highest yield)\r
\r
| Pattern | What to look for |\r
|---|---|\r
| **Undeclared fallback** | Sample/placeholder/default data reaching the visitor with no notice, badge, or flag. Compare against the `FallbackMode` notice switch and the `isSample` badge convention. |\r
| **Fallback-cause collapse** | Two distinct causes (not configured vs. genuinely failed; no match vs. bad token; denied vs. unavailable) mapping to the same visitor-facing outcome **and** the same log line. The 503-vs-everything-else split in `extract-client.ts` is the reference. |\r
| **Non-exhaustive fallback switch** | A new variant added to a mode/result union without extending the `never`-guarded switch — the compile error is the safety net; a `default:` that returns a generic string removes it. |\r
| **Partial result without a flag** | Dropping entries from a derived list without counting them and without an `extractedScopesPartial`-style flag the document/UI can annotate. Silently short output on a forensic document is the worst case. |\r
| **Stale async write** | Store mutation after an `await` with no generation-token re-check. A cancel or a newer run landing mid-flight then gets clobbered — invisibly. |\r
| **Blank-record creation on empty parse** | Creating an entity from a parse that yielded nothing. `run-import.ts` explicitly rejects this for live replies; new import/parse paths must too. |\r
| **Breadcrumb removal** | Deleting a `console.warn`/`console.error` that a prior review added as the operator's only diagnostic signal. Check `git log`/blame before assuming a log line is noise. |\r
| **Guard-arm no-op** | Store actions begin `if (!currentLocationId) return` / `if (!loc) return`. Correct as internal guards — but a *new* user-triggered action that silently no-ops when its precondition fails leaves the visitor pressing a dead button. |\r
| **Engine parse leniency** | `engine/logic/*` parsers that return the input unchanged, or a zero/empty value, when they can't parse — against `time.ts`'s stated "fail loud" convention. (See tracked §15 for the two existing instances.) |\r
| **Route-handler guard weakening** | Removing/reordering the body cap, origin allowlist, or rate limit in `app/api/extract/route.ts`, or dropping the abort timeout — the proxy spends a paid budget, and a hung request has no visible failure. |\r
| **Untrusted model output trusted** | Values from `/api/extract` used without validation — unbounded strings into a document, non-finite numbers into math, unexpected keys merged into state. |\r
\r
#### Generic TypeScript / async\r
\r
| Pattern | What to look for |\r
|---|---|\r
| `try { ... } catch { return default }` | Catch arms with no logging, no flag, no surface |\r
| `try { ... } catch (e) { /* ignore */ }` | Explicitly intentional silence — needs a written reason and usually a dev-warn |\r
| `JSON.parse(x)` unwrapped | Throws on bad input; the import path parses model output |\r
| `.then(...)` without `.catch(...)` | Unhandled rejection at runtime |\r
| `Promise.all` where partial tolerance is wanted | One rejection discards every other result; `allSettled` is the partial-tolerance shape |\r
| Discriminated-union `default:` returning null/empty | New variants silently fall through — use the `never` exhaustiveness check |\r
| Errors surfaced as `null` | Caller can't distinguish "nothing found" from "broken." Only acceptable when the contract is documented **and** the caller genuinely doesn't need to distinguish (`forwardGeocode` is the sanctioned example — and it still warns) |\r
| NaN / ±Infinity propagation | `NaN < x` and `NaN >= x` are both `false`, so comparison guards let NaN through. Check coordinates, parsed timestamps, retention/offset math |\r
| `setState` after unmount | Effects/timers must gate on a cleanup flag |\r
| Missing cleanup | Listeners, observers, timers, abort controllers, `mapbox-gl` map instances, object URLs |\r
| `fetch` without abort/timeout | Can hang indefinitely with no failure surface |\r
| `array.forEach(async fn)` | Does not await — errors vanish, ordering is a lie |\r
\r
### 4. Trace Adversarially, End to End\r
For every MEDIUM-or-above candidate, trace a concrete adversarial input from its entry point (visitor upload, model reply, missing env var, denied permission, network failure, rapid double-click) through the changed code to the observable outcome. State plainly: **what the visitor sees, what the log shows, and what actually happened.**\r
\r
