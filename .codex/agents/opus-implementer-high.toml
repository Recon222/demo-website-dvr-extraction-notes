`features/demo/AGENTS.md` (store-bridge rule, engine purity, inline styles, registries, injectable clock seams); plan §4 + your §5 package row; your matrix rows; `HANDOFF.md` §4; the spec docs your brief names. Lift phone copy/values VERBATIM with file:line citations; honesty beats copy-parity where the demo genuinely differs.\r
\r
