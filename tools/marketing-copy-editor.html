plete — it geocodes either way, so the location carries both the human-readable address and the coordinates.","multiline":true},{"id":"features.location.rows.0.recLabel","label":"Row 1 — REC label","path":"features.location.rows.0.recLabel","value":"REC 01 — USE MY LOCATION","multiline":false},{"id":"features.location.rows.1.kicker","label":"Row 2 — kicker","path":"features.location.rows.1.kicker","value":"02 — THE CAMERAS","multiline":false},{"id":"features.location.rows.1.heading","label":"Row 2 — heading","path":"features.location.rows.1.heading","value":"Stand under it, mark it","multiline":false},{"id":"features.location.rows.1.body","label":"Row 2 — body","path":"features.location.rows.1.body","value":"GPS-mark every camera on site — literally stand under each one and capture its position, tied to the location it belongs to. Months later, the coverage picture is still exact.","multiline":true},{"id":"features.location.rows.1.recLabel","label":"Row 2 — REC label","path":"features.location.rows.1.recLabel","value":"REC 02 — MARK A CAMERA","multiline":false},{"id":"features.location.diagram.heading","label":"Diagram heading","path":"features.location.diagram.heading","value":"Address to coordinates, and back","multiline":false},{"id":"features.location.diagram.caption","label":"Diagram caption","path":"features.location.diagram.caption","value":"Address ⇄ coordinates, plus a GPS pin for every camera.","multiline":true},{"id":"features.location.betaStripLine","label":"Beta strip line","path":"features.location.betaStripLine","value":"Never reconstruct a scene from memory again.","multiline":false}]},{"id":"map","label":"Map","fields":[{"id":"features.map.navLabel","label":"Nav label","path":"features.map.navLabel","value":"Map","multiline":false},{"id":"features.map.eyebrow","label":"Eyebrow","path":"features.map.eyebrow","value":"Case map","multiline":false},{"id":"features.map.title","label":"Title (card / prev-next)","path":"features.map.title","value":"Your whole case on a map","multiline":false},{"id":"features.map.painLine","label":"Pain line (WHAT IT KILLS)","path":"features.map.painLine","value":"The whole case on one map — tap a pin to call or email the investigator or site contact.","multiline":true},{"id":"features.map.intro","label":"Intro (** = bold)","path":"features.map.intro","value":"Multi-location cases are hard to hold in your head — and reaching a contact means digging for a number. On the map, **the shape of the job is obvious, and every contact is one tap away.**","multiline":true},{"id":"features.map.tip.body","label":"Tip card (cyan)","path":"features.map.tip.body","value":"The pins carry people, not just places — the requesting investigator and the on-site contact ride with each location.","multiline":true},{"id":"features.map.rows.0.kicker","label":"Row 1 — kicker","path":"features.map.rows.0.kicker","value":"01 — THE SHAPE OF THE JOB","multiline":false},{"id":"features.map.rows.0.heading","label":"Row 1 — heading","path":"features.map.rows.0.heading","value":"Every location, one view","multiline":false},{"id":"features.map.rows.0.body","label":"Row 1 — body","path":"features.map.rows.0.body","value":"See all the locations in a case on a live map — which sites are done, which are pending, and how the job lays out across town before you commit to a driving order.","multiline":true},{"id":"features.map.rows.0.recLabel","label":"Row 1 — REC label","path":"features.map.rows.0.recLabel","value":"REC 01 — CASE MAP","multiline":false},{"id":"features.map.rows.1.kicker","label":"Row 2 — kicker","path":"features.map.rows.1.kicker","value":"02 — THE PEOPLE","multiline":false},{"id":"features.map.rows.1.heading","label":"Row 2 — heading","path":"features.map.rows.1.heading","value":"Contacts one tap away","multiline":false},{"id":"features.map.rows.1.body","label":"Row 2 — body","path":"features.map.rows.1.body","value":"Tap a pin to call or email the requesting investigator or the on-site contact, right from the map — no digging through the case for a phone number while you're double-parked.","multiline":true},{"id":"features.map.rows.1.recLabel","label":"Row 2 — REC label","path":"features.map.rows.1.recLabel","value":"REC 02 — PIN CONTACTS","multiline":false},{"id":"features.map.betaStripLine","label":"Beta strip line","path":"features.map.betaStripLine","value":"Hold the whole job in one view.","multiline":false}]},{"id":"time-calibration","label":"Time Offset","fields":[{"id":"features.time-calibration.navLabel","label":"Nav label","path":"features.time-calibration.navLabel","value":"Time Offset","multiline":false},{"id":"features.time-calibration.eyebrow","label":"Eyebrow","path":"features.time-calibration.eyebrow","value":"Time calibration","multiline":false},{"id":"features.time-calibration.title","label":"Title (card / prev-next)","path":"features.time-calibration.title","value":"The timestamp you can defend","multiline":false},{"id":"features.time-calibration.painLine","label":"Pain line (WHAT IT KILLS)","path":"features.time-calibration.painLine","value":"The DVR clock is wrong. Yours is provably right — calibrated against atomic time at capture.","multiline":true},{"id":"features.time-calibration.intro","label":"Intro (** = bold)","path":"features.time-calibration.intro","value":"DVR clocks are almost always wrong. That's fine — expected, even. What ends people on the stand is the other clock: proving **your own device's time** was right. This app answers that question before it's asked.","multiline":true},{"id":"features.time-calibration.tip.body","label":"Tip card (gold)","path":"features.time-calibration.tip.body","value":"The old way: an external time site, a manual reference check, and a hand-typed note you'll be asked about a year later. The new way is a receipt, printed into every report.","multiline":true},{"id":"features.time-calibration.rows.0.kicker","label":"Row 1 — kicker","path":"features.time-calibration.rows.0.kicker","value":"01 — READ","multiline":false},{"id":"features.time-calibration.rows.0.heading","label":"Row 1 — heading","path":"features.time-calibration.rows.0.heading","value":"Read the DVR clock — don't retype it","multiline":false},{"id":"features.time-calibration.rows.0.body","label":"Row 1 — body","path":"features.time-calibration.rows.0.body","value":"Point your phone at the on-screen timestamp. On-device text recognition reads it for you — no transcription, no typos, and the cropped image of the clock rides along as proof of exactly what you saw.","multiline":true},{"id":"features.time-calibration.rows.0.recLabel","label":"Row 1 — REC label","path":"features.time-calibration.rows.0.recLabel","value":"REC 01 — OCR CAPTURE","multiline":false},{"id":"features.time-calibration.rows.1.kicker","label":"Row 2 — kicker","path":"features.time-calibration.rows.1.kicker","value":"02 — SYNC","multiline":false},{"id":"features.time-calibration.rows.1.heading","label":"Row 2 — heading","path":"features.time-calibration.rows.1.heading","value":"Calibrated against an atomic clock, at the moment of capture","multiline":false},{"id":"features.time-calibration.rows.1.body","label":"Row 2 — body","path":"features.time-calibration.rows.1.body","value":"The instant you capture, the app reaches a regional atomic-clock time server, computes the offset between DVR time and real time, and prints the whole traceability chain into the report. If the network blocks NTP, it falls back to an HTTP time source — and says so.","multiline":true},{"id":"features.time-calibration.rows.1.recLabel","label":"Row 2 — REC label","path":"features.time-calibration.rows.1.recLabel","value":"REC 02 — NTP SYNC","multiline":false},{"id":"features.time-calibration.diagram.heading","label":"Diagram heading","path":"features.time-calibration.diagram.heading","value":"The traceability chain, in plain language","multiline":false},{"id":"features.time-calibration.diagram.caption","label":"Diagram caption","path":"features.time-calibration.diagram.caption","value":"The chain printed into every Time Offset Report: DVR clock → phone OCR → NTP server → atomic clock → UTC → your offset.","multiline":true},{"id":"features.time-calibration.betaStripLine","label":"Beta strip line","path":"features.time-calibration.betaStripLine","value":"Want the receipt on your next scene?","multiline":false}]},{"id":"evidence-capture","label":"Media Capture","fields":[{"id":"features.evidence-capture.navLabel","label":"Nav label","path":"features.evidence-capture.navLabel","value":"Media Capture","multiline":false},{"id":"features.evidence-capture.eyebrow","label":"Eyebrow","path":"features.evidence-capture.eyebrow","value":"Evidence capture","multiline":false},{"id":"features.evidence-capture.title","label":"Title (card / prev-next)","path":"features.evidence-capture.title","value":"Photos, video, and audio — filed for you","multiline":false},{"id":"features.evidence-capture.headline","label":"Headline (page H1)","path":"features.evidence-capture.headline","value":"Photos, video, audio — filed for you.","multiline":false},{"id":"features.evidence-capture.painLine","label":"Pain line (WHAT IT KILLS)","path":"features.evidence-capture.painLine","value":"Scene media scattered through your camera roll — captured inside the case, filed automatically.","multiline":true},{"id":"features.evidence-capture.intro","label":"Intro (** = bold)","path":"features.evidence-capture.intro","value":"Scene media ends up scattered in your camera roll, cut off from the case it belongs to. Here you shoot from inside the location — **and every file lands in the right folder the moment it's captured.**","multiline":true},{"id":"features.evidence-capture.tip.body","label":"Tip card (cyan)","path":"features.evidence-capture.tip.body","value":"Native resolution, no compression games — what the sensor saw is what the case keeps.","multiline":true},{"id":"features.evidence-capture.rows.0.kicker","label":"Row 1 — kicker","path":"features.evidence-capture.rows.0.kicker","value":"01 — INSIDE THE CASE","multiline":false},{"id":"features.evidence-capture.rows.0.heading","label":"Row 1 — heading","path":"features.evidence-capture.rows.0.heading","value":"Capture inside the case","multiline":false},{"id":"features.evidence-capture.rows.0.body","label":"Row 1 — body","path":"features.evidence-capture.rows.0.body","value":"Shoot photo and video at native resolution and record audio with a live waveform — all from inside the location you're documenting, so nothing has to be matched up later.","multiline":true},{"id":"features.evidence-capture.rows.0.recLabel","label":"Row 1 — REC label","path":"features.evidence-capture.rows.0.recLabel","value":"REC 01 — CAPTURE","multiline":false},{"id":"features.evidence-capture.rows.1.kicker","label":"Row 2 — kicker","path":"features.evidence-capture.rows.1.kicker","value":"02 — NO SORTING LATER","multiline":false},{"id":"features.evidence-capture.rows.1.heading","label":"Row 2 — heading","path":"features.evidence-capture.rows.1.heading","value":"Organized automatically","multiline":false},{"id":"features.evidence-capture.rows.1.body","label":"Row 2 — body","path":"features.evidence-capture.rows.1.body","value":"Every file lands in the right location's folder, sorted into photos, videos, and audio. No renaming, no sorting, no \"which site was IMG_4471 from?\" at your desk a week later.","multiline":true},{"id":"features.evidence-capture.rows.1.recLabel","label":"Row 2 — REC label","path":"features.evidence-capture.rows.1.recLabel","value":"REC 02 — LIBRARY","multiline":false},{"id":"features.evidence-capture.diagram.heading","label":"Diagram heading","path":"features.evidence-capture.diagram.heading","value":"Filed as you shoot","multiline":false},{"id":"features.evidence-capture.diagram.caption","label":"Diagram caption","path":"features.evidence-capture.diagram.caption","value":"Case → locations → photo, video, and audio folders, organized as you capture.","multiline":true},{"id":"features.evidence-capture.betaStripLine","label":"Beta strip line","path":"features.evidence-capture.betaStripLine","value":"Your camera roll stays yours. The case keeps its own.","multiline":false}]},{"id":"reports","label":"Reports","fields":[{"id":"features.reports.navLabel","label":"Nav label","path":"features.reports.navLabel","value":"Reports","multiline":false},{"id":"features.reports.eyebrow","label":"Eyebrow","path":"features.reports.eyebrow","value":"Reports","multiline":false},{"id":"features.reports.title","label":"Title (card / prev-next)","path":"features.reports.title","value":"The report, generated for you","multiline":false},{"id":"features.reports.painLine","label":"Pain line (WHAT IT KILLS)","path":"features.reports.painLine","value":"The write-up you'd still owe after all the field work — generated from what you already captured.","multiline":true},{"id":"features.reports.intro","label":"Intro (** = bold)","path":"features.reports.intro","value":"After the scene work is done, the write-up still has to be produced — formatted, complete, every time. Here it's already waiting: **everything you captured, assembled into the finished PDF.** You verify, the app types.","multiline":true},{"id":"features.reports.tip.body","label":"Tip card (gold)","path":"features.reports.tip.body","value":"Nothing in the report is invented. Every section is assembled from fields you entered and verified during the job — the report is the receipt for the work.","multiline":true},{"id":"features.reports.rows.0.kicker","label":"Row 1 — kicker","path":"features.reports.rows.0.kicker","value":"01 — ONE TAP","multiline":false},{"id":"features.reports.rows.0.heading","label":"Row 1 — heading","path":"features.reports.rows.0.heading","value":"One tap to the full case-notes PDF","multiline":false},{"id":"features.reports.rows.0.body","label":"Row 1 — body","path":"features.reports.rows.0.body","value":"Every section assembled from the data you already captured — the case, each location, the scopes, the personnel, the media inventory. Formatted the same way every time, complete every time.","multiline":true},{"id":"features.reports.rows.0.recLabel","label":"Row 1 — REC label","path":"features.reports.rows.0.recLabel","value":"REC 01 — GENERATE PDF","multiline":false},{"id":"features.reports.rows.1.kicker","label":"Row 2 — kicker","path":"features.reports.rows.1.kicker","value":"02 — THE PROOF RIDES ALONG","multiline":false},{"id":"features.reports.rows.1.heading","label":"Row 2 — heading","path":"features.reports.rows.1.heading","value":"Calibration proof, attached","multiline":false},{"id":"features.reports.rows.1.body","label":"Row 2 — body","path":"features.reports.rows.1.body","value":"The Time Offset Report travels with the case notes: the cropped image of the DVR timestamp, the sync details, and the full traceability chain — so the time story is answered inside the same document.","multiline":true},{"id":"features.reports.rows.1.recLabel","label":"Row 2 — REC label","path":"features.reports.rows.1.recLabel","value":"REC 02 — TIME OFFSET REPORT","multiline":false},{"id":"features.reports.diagram.heading","label":"Diagram heading","path":"features.reports.diagram.heading","value":"Everything you captured, one document out","multiline":false},{"id":"features.reports.diagram.caption","label":"Diagram caption","path":"features.reports.diagram.caption","value":"All your captured data → the case-notes report, plus the time-offset report.","multiline":true},{"id":"features.reports.betaStripLine","label":"Beta strip line","path":"features.reports.betaStripLine","value":"Leave the scene with the report done.","multiline":false}]},{"id":"secure-export","label":"Encrypted Export","fields":[{"id":"features.secure-export.navLabel","label":"Nav label","path":"features.secure-export.navLabel","value":"Encrypted Export","multiline":false},{"id":"features.secure-export.eyebrow","label":"Eyebrow","path":"features.secure-export.eyebrow","value":"Secure handoff","multiline":false},{"id":"features.secure-export.title","label":"Title (card / prev-next)","path":"features.secure-export.title","value":"Package the whole case, encrypted","multiline":false},{"id":"features.secure-export.headline","label":"Headline (page H1)","path":"features.secure-export.headline","value":"The whole case, sealed for handoff.","multiline":false},{"id":"features.secure-export.painLine","label":"Pain line (WHAT IT KILLS)","path":"features.secure-export.painLine","value":"Handing off a case means the report plus every file — one password-protected archive, your password.","multiline":true},{"id":"features.secure-export.intro","label":"Intro (** = bold)","path":"features.secure-export.intro","value":"Delivering a case means the report and every file that backs it — together, intact, and not readable by whoever finds the USB stick. One export: **documents and media in a tidy folder structure, inside a password-protected archive.**","multiline":true},{"id":"features.secure-export.tip.body","label":"Tip card (cyan)","path":"features.secure-export.tip.body","value":"The password is yours — set by you, known to you, **never stored by us.** Exporting itself can be gated behind Face ID.","multiline":true},{"id":"features.secure-export.rows.0.kicker","label":"Row 1 — kicker","path":"features.secure-export.rows.0.kicker","value":"01 — ONE PACKAGE","multiline":false},{"id":"features.secure-export.rows.0.heading","label":"Row 1 — heading","path":"features.secure-export.rows.0.heading","value":"Export a location — or the entire case","multiline":false},{"id":"features.secure-export.rows.0.body","label":"Row 1 — body","path":"features.secure-export.rows.0.body","value":"Pick the scope and the app assembles everything that belongs to it: the reports, the photos, the video, the audio, the documents — in the same folder structure the app keeps on disk, so the recipient isn't guessing.","multiline":true},{"id":"features.secure-export.rows.0.recLabel","label":"Row 1 — REC label","path":"features.secure-export.rows.0.recLabel","value":"REC 01 — BUILD THE PACKAGE","multiline":false},{"id":"features.secure-export.rows.1.kicker","label":"Row 2 — kicker","path":"features.secure-export.rows.1.kicker","value":"02 — YOUR PASSWORD","multiline":false},{"id":"features.secure-export.rows.1.heading","label":"Row 2 — heading","path":"features.secure-export.rows.1.heading","value":"Sealed with a password only you know","multiline":false},{"id":"features.secure-export.rows.1.body","label":"Row 2 — body","path":"features.secure-export.rows.1.body","value":"The archive is encrypted with a password you set — hand it to the requester however your agency moves files, and the contents stay sealed in transit. Face ID can gate the export action itself, so a borrowed phone can't ship your cases.","multiline":true},{"id":"features.secure-export.rows.1.recLabel","label":"Row 2 — REC label","path":"features.secure-export.rows.1.recLabel","value":"REC 02 — SEAL & SHARE","multiline":false},{"id":"features.secure-export.diagram.heading","label":"Diagram heading","path":"features.secure-export.diagram.heading","value":"Case to sealed archive, step by step","multiline":false},{"id":"features.secure-export.diagram.caption","label":"Diagram caption","path":"features.secure-export.diagram.caption","value":"Case → password-protected encrypted archive → shared on your terms.","multiline":true},{"id":"features.secure-export.betaStripLine","label":"Beta strip line","path":"features.secure-export.betaStripLine","value":"Hand off your next case sealed.","multiline":false}]},{"id":"on-device","label":"Security and Privacy","fields":[{"id":"features.on-device.navLabel","label":"Nav label","path":"features.on-device.navLabel","value":"Security and Privacy","multiline":false},{"id":"features.on-device.eyebrow","label":"Eyebrow","path":"features.on-device.eyebrow","value":"Privacy by design","multiline":false},{"id":"features.on-device.title","label":"Title (card / prev-next)","path":"features.on-device.title","value":"On your device, under your control","multiline":false},{"id":"features.on-device.painLine","label":"Pain line (WHAT IT KILLS)","path":"features.on-device.painLine","value":"Evidence software that phones home is a non-starter. Case data lives on your device, encrypted, behind Face ID.","multiline":true},{"id":"features.on-device.intro","label":"Intro (** = bold)","path":"features.on-device.intro","value":"Evidence software that quietly ships data to a vendor cloud is a non-starter. This one was built by someone whose own cases would be in it.","multiline":true},{"id":"features.on-device.rows.0.kicker","label":"Row 1 — kicker","path":"features.on-device.rows.0.kicker","value":"01 — IT STAYS ON THE PHONE","multiline":false},{"id":"features.on-device.rows.0.heading","label":"Row 1 — heading","path":"features.on-device.rows.0.heading","value":"Encrypted, local, biometric-locked","multiline":false},{"id":"features.on-device.rows.0.body","label":"Row 1 — body","path":"features.on-device.rows.0.body","value":"Case data lives in an encrypted database on your device, behind a biometric lock. On-device AI means even the request documents never leave. There is no vendor cloud to breach.","multiline":true},{"id":"features.on-device.rows.1.kicker","label":"Row 2 — kicker","path":"features.on-device.rows.1.kicker","value":"02 — YOU DECIDE WHAT LEAVES","multiline":false},{"id":"features.on-device.rows.1.heading","label":"Row 2 — heading","path":"features.on-device.rows.1.heading","value":"Three things touch the network","multiline":false},{"id":"features.on-device.rows.1.body","label":"Row 2 — body","path":"features.on-device.rows.1.body","value":"Time-server packets, map look-ups, and anonymous crash reports — never your case data. The complete ledger, item by item, is on the privacy page.","multiline":true},{"id":"features.on-device.diagram.heading","label":"Diagram heading","path":"features.on-device.diagram.heading","value":"What stays vs. the little that leaves","multiline":false},{"id":"features.on-device.diagram.caption","label":"Diagram caption","path":"features.on-device.diagram.caption","value":"What stays on your device versus the little that leaves — and exactly what it is.","multiline":true},{"id":"features.on-device.betaStripLine","label":"Beta strip line","path":"features.on-device.betaStripLine","value":"Run software you'd trust with your own cases.","multiline":false}]}]},{"id":"beta","label":"Beta","sections":[{"id":"header","label":"Header","fields":[{"id":"beta.header.chip","label":"Chip","path":"beta.header.chip","value":"MANIFEST / BETA ACCESS","multiline":false},{"id":"beta.header.h1","label":"H1","path":"beta.header.h1","value":"Be first in the field.","multiline":false},{"id":"beta.header.sub","label":"Sub","path":"beta.header.sub","value":"The beta is the full analyst app, on your phone, via TestFlight. Leave your email now — the invite ships the moment a build clears Apple’s beta review.","multiline":true}]},{"id":"phaseA","label":"Phase A (intake)","fields":[{"id":"beta.phaseA.tab","label":"Phase A tab","path":"beta.phaseA.tab","value":"INTAKE FORM — 60 SECONDS","multiline":false},{"id":"beta.phaseA.h2","label":"Phase A heading","path":"beta.phaseA.h2","value":"Get on the invite list","multiline":false},{"id":"beta.phaseA.body","label":"Phase A body","path":"beta.phaseA.body","value":"One field. No account, no vendor onboarding call. When the build is approved you get a TestFlight link — until then, silence.","multiline":true},{"id":"beta.phaseA.trust","label":"Phase A trust","path":"beta.phaseA.trust","value":"WE KEEP YOUR ADDRESS AND NOTHING ELSE — CASE DATA NEVER TOUCHES OUR SERVERS","multiline":false},{"id":"beta.phaseA.status","label":"Phase A status","path":"beta.phaseA.status","value":"STATUS: AWAITING FIRST BUILD — BETA APP REVIEW PENDING","multiline":false}]},{"id":"phaseB","label":"Phase B (live link)","fields":[{"id":"beta.phaseB.tab","label":"Phase B tab"," .what","value":"Map look-ups","multiline":false},{"id":"privacy.ledger.1.when","label":"Row 2 — when","path":"privacy.ledger.1.when","value":"When you geocode an address or open the case map","multiline":true},{"id":"privacy.ledger.1.contains","label":"Row 2 — contains","path":"privacy.ledger.1.contains","value":"The address string you typed. Nothing else.","multiline":true},{"id":"privacy.ledger.2.what","label":"Row 3 — what","path":"privacy.ledger.2.what","value":"Crash reports","multiline":false},{"id":"privacy.ledger.2.when","label":"Row 3 — when","path":"privacy.ledger.2.when","value":"If the app crashes","multiline":true},{"id":"privacy.ledger.2.contains","label":"Row 3 — contains","path":"privacy.ledger.2.contains","value":"Anonymous stack trace. No case content.","multiline":true},{"id":"privacy.ledger.goldRowWhat","label":"Ledger gold row — what","path":"privacy.ledger.goldRowWhat","value":"Everything else","multiline":false},{"id":"privacy.ledger.goldRowContains","label":"Ledger gold row — contains","path":"privacy.ledger.goldRowContains","value":"Cases, locations, media, documents, reports, the AI’s reading of your requests","multiline":true}]},{"id":"sections","label":"Policy Sections","fields":[{"id":"privacy.sections.0.title","label":"Section 1 — title","path":"privacy.sections.0.title","value":"What stays on the phone","multiline":false},{"id":"privacy.sections.0.body","label":"Section 1 — body","path":"privacy.sections.0.body","value":"Everything you create — cases, locations, photos, video, audio, documents, notes, and reports — is stored in an encrypted database on your device, behind your device passcode and Face ID. We operate no server that receives, stores, or can access your case data.","multiline":true},{"id":"privacy.sections.1.title","label":"Section 2 — title","path":"privacy.sections.1.title","value":"The on-device AI","multiline":false},{"id":"privacy.sections.1.body","label":"Section 2 — body","path":"privacy.sections.1.body","value":"Request import uses Apple's on-device intelligence (iOS 26+). The document is read on your phone's own hardware — its contents are not transmitted to Apple, to us, or to any third party. If your device doesn't support it, the feature is simply unavailable; nothing falls back to a cloud service.","multiline":true},{"id":"privacy.sections.2.title","label":"Section 3 — title","path":"privacy.sections.2.title","value":"Permissions we ask for","multiline":false},{"id":"privacy.sections.3.title","label":"Section 4 — title","path":"privacy.sections.3.title","value":"What you export","multiline":false},{"id":"privacy.sections.3.body","label":"Section 4 — body","path":"privacy.sections.3.body","value":"Sharing is always your action: exports are password-protected encrypted archives, the password is set by you, and where they go is your call. The app never uploads a package anywhere on its own.","multiline":true},{"id":"privacy.sections.4.title","label":"Section 5 — title","path":"privacy.sections.4.title","value":"The beta email list","multiline":false},{"id":"privacy.sections.4.body","label":"Section 5 — body","path":"privacy.sections.4.body","value":"If you sign up for the beta on this site, we store the email address you give us and use it for exactly one thing: beta invites and beta updates. Unsubscribe ends it; we don't share or sell the list.","multiline":true},{"id":"privacy.sections.5.title","label":"Section 6 — title","path":"privacy.sections.5.title","value":"Contact","multiline":false}]},{"id":"permissions","label":"Permissions","fields":[{"id":"privacy.permissions.intro","label":"Permissions intro","path":"privacy.permissions.intro","value":"Each permission maps to one visible feature — nothing runs in the background:","multiline":true},{"id":"privacy.permissions.0.key","label":"Permission 1 — key","path":"privacy.permissions.0.key","value":"CAMERA","multiline":false},{"id":"privacy.permissions.0.use","label":"Permission 1 — use","path":"privacy.permissions.0.use","value":"reading DVR timestamps (OCR) and capturing scene photos/video","multiline":true},{"id":"privacy.permissions.1.key","label":"Permission 2 — key","path":"privacy.permissions.1.key","value":"MICROPHONE","multiline":false},{"id":"privacy.permissions.1.use","label":"Permission 2 — use","path":"privacy.permissions.1.use","value":"recording audio notes at a location","multiline":true},{"id":"privacy.permissions.2.key","label":"Permission 3 — key","path":"privacy.permissions.2.key","value":"LOCATION","multiline":false},{"id":"privacy.permissions.2.use","label":"Permission 3 — use","path":"privacy.permissions.2.use","value":"pinning sites and GPS-marking cameras, only while you use it","multiline":true},{"id":"privacy.permissions.3.key","label":"Permission 4 — key","path":"privacy.permissions.3.key","value":"FACE ID","multiline":false},{"id":"privacy.permissions.3.use","label":"Permission 4 — use","path":"privacy.permissions.3.use","value":"unlocking the app and gating encrypted exports","multiline":true},{"id":"privacy.contact.body","label":"Contact line","path":"privacy.contact.body","value":"Questions about any of this:","multiline":false}]}]}]};

const $ = (s, el = document) => el.querySelector(s);
const make = (tag, cls, props = {}) => Object.assign(document.createElement(tag), cls ? { className: cls } : {}, props);

// flat index of every field + baseline/current value stores
const FIELDS = {};        // path -> { field, page, section }
const baseline = {};      // path -> original value
const values = {};        // path -> current (edited) value
for (const page of COPY.pages) for (const section of page.sections) for (const f of section.fields) {
  FIELDS[f.path] = { field: f, page, section };
  baseline[f.path] = f.value;
  values[f.path] = f.value;
}
const allPaths = Object.keys(FIELDS);
$('#total-count').textContent = String(allPaths.length);

let active = { page: COPY.pages[0].id, section: COPY.pages[0].sections[0].id };

// ── sidebar ────────────────────────────────────────────────────────────────
function renderSidebar() {
  const nav = $('#sidebar');
  nav.textContent = '';
  for (const page of COPY.pages) {
    nav.append(make('div', 'mb-1 mt-3 px-2 font-mono text-[10px] uppercase tracking-[0.2em] text-slate-500', { textContent: page.label }));
    for (const section of page.sections) {
      const edits = section.fields.filter((f) => values[f.path] !== baseline[f.path]).length;
      const btn = make('button', 'navitem flex w-full items-center gap-2 rounded border border-transparent px-3 py-1.5 text-left text-[13px] text-slate-400 transition hover:text-slate-100', { type: 'button' });
      if (active.page === page.id && active.section === section.id) btn.classList.add('active');
      btn.append(make('span', 'flex-1 truncate', { textContent: section.label }));
      if (edits) btn.append(make('span', 'font-mono text-[10px] text-cyan', { textContent: '●' + edits }));
      btn.addEventListener('click', () => { active = { page: page.id, section: section.id }; render(); });
      nav.append(btn);
    }
  }
}

// ── main pane ────────────────────────────────────────────────────────────────
function activeSection() {
  const page = COPY.pages.find((p) => p.id === active.page);
  return { page, section: page.sections.find((s) => s.id === active.section) };
}
function renderPane() {
  const { page, section } = activeSection();
  $('#crumb').textContent = page.label;
  $('#section-title').textContent = section.label;
  const pane = $('#pane');
  pane.textContent = '';
  const wrap = make('div', 'mx-auto max-w-3xl space-y-6');

  for (const f of section.fields) {
    const card = make('div', 'rounded-lg border border-white/10 bg-ink-800/60 p-4');
    const head = make('div', 'mb-1.5 flex items-baseline gap-2');
    head.append(make('span', 'font-mono text-[11px] uppercase tracking-[0.12em] text-carolina', { textContent: f.label }));
    head.append(make('span', 'ml-auto font-mono text-[10px] text-slate-600', { textContent: f.path }));
    card.append(head);

    // on-file reference (baseline)
    const ref = make('div', 'mb-2 whitespace-pre-wrap rounded border-l-2 border-white/10 bg-black/25 px-3 py-2 text-[13px] leading-relaxed text-slate-500', { textContent: baseline[f.path] || '— empty —' });
    card.append(ref);

    // editable
    const ctl = make(f.multiline ? 'textarea' : 'input', 'field w-full rounded border border-white/12 bg-ink-900 px-3 py-2 text-[14px] leading-relaxed text-slate-100', { value: values[f.path] });
    if (f.multiline) ctl.rows = Math.min(8, Math.max(2, String(values[f.path]).length / 60 | 0 + 2)); else ctl.type = 'text';
    ctl.setAttribute('aria-label', section.label + ' — ' + f.label);
    ctl.addEventListener('input', () => { values[f.path] = ctl.value; refreshCounts(); });
    card.append(ctl);
    wrap.append(card);
  }
  pane.append(wrap);
  pane.scrollTop = 0;
}
function render() { renderSidebar(); renderPane(); }
function refreshCounts() {
  $('#edited-count').textContent = String(allPaths.filter((p) => values[p] !== baseline[p]).length);
  // update sidebar edit badges without losing focus in the pane
  renderSidebar();
}

// ── export ────────────────────────────────────────────────────────────────
// Export ONLY the fields that changed, as Was/Now blocks — the baseline is the
// source copy baked in at build, so this is the exact delta to apply back.
function toMarkdown() {
  const changed = allPaths.filter((p) => values[p] !== baseline[p]);
  const out = [
    '# DVR Extraction Notes — Marketing copy edits',
    `<!-- ${changed.length} changed field(s). [path] = source location; apply each "Now" in place of "Was". -->`,
    '',
  ];
  if (!changed.length) { out.push('_No changes yet — edit a field, then export._', ''); return out.join('\n'); }
  for (const page of COPY.pages) for (const section of page.sections) {
    const fields = section.fields.filter((f) => values[f.path] !== baseline[f.path]);
    if (!fields.length) continue;
    out.push(`## ${page.label} · ${section.label}`, '');
    for (const f of fields) {
      out.push(
        `### ${f.label}  ·  [${f.path}]`, '',
        '**Was:**', '', baseline[f.path] || '_(empty)_', '',
        '**Now:**', '', values[f.path] || '_(empty)_', '',
        '---', '',
      );
    }
  }
  return out.join('\n');
}
function toJsonSnapshot() {
  const snap = JSON.parse(JSON.stringify(COPY));
  for (const page of snap.pages) for (const s of page.sections) for (const f of s.fields) f.value = values[f.path];
  return JSON.stringify(snap, null, 2);
}
function toast(m) { const t = $('#toast'); t.textContent = m; clearTimeout(toast._t); toast._t = setTimeout(() => (t.textContent = ''), 2600); }
async function copyText(str, label) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(str); toast(label + ' copied ✓'); return; } throw 0; }
  catch { const ta = $('#preview'); ta.value = str; ta.focus(); ta.select(); document.execCommand && document.execCommand('copy'); toast(label + ' copied ✓'); }
}
function download(str) {
  const url = URL.createObjectURL(new Blob([str], { type: 'text/markdown;charset=utf-8' }));
  const a = make('a', null, { href: url, download: 'marketing-copy-changes.md' });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ── wire up ────────────────────────────────────────────────────────────────
$('#btn-export').addEventListener('click', () => { $('#preview').value = toMarkdown(); $('#tray').classList.remove('hidden'); });
$('#btn-close-tray').addEventListener('click', () => $('#tray').classList.add('hidden'));
$('#btn-download').addEventListener('click', () => { download(toMarkdown()); toast('Downloaded marketing-copy-changes.md ✓'); });
$('#btn-copy-md').addEventListener('click', () => copyText(toMarkdown(), 'Markdown'));
$('#btn-copy-json').addEventListener('click', () => copyText(toJsonSnapshot(), 'JSON snapshot'));
$('#btn-reset').addEventListener('click', () => {
  if (!confirm('Reset every field back to the current site copy?')) return;
  for (const p of allPaths) values[p] = baseline[p];
  render();
});

render();
</script>
