<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DVR Extraction Notes — Marketing Copy Editor</title>

<!--
  MARKETING COPY EDITOR — generated by tools/build-marketing-copy-editor.mjs.
  Do not hand-edit the COPY below; re-run the generator to refresh it from source.
  Round-trip: edit here → Export markdown → apply to source → re-run the generator.
  Each field's [path] tag points at its home in the site source.
-->

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { ink:{900:'#04070d',850:'#070d18',800:'#0a1422',700:'#0f1f34'}, carolina:'#2B8CC1', cyan:'#4ecdc4', gold:'#ffd93d' },
    fontFamily: { sans:['Inter','system-ui','sans-serif'], mono:['"JetBrains Mono"','monospace'], hud:['"Share Tech Mono"','monospace'] },
  }}}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<style>
  :root { color-scheme: dark; }
  body { background:#04070d; }
  .field:focus { outline:none; border-color:#2B8CC1; box-shadow:0 0 0 1px #2B8CC1, 0 0 14px rgba(43,140,193,0.25); }
  textarea { resize:vertical; }
  ::selection { background:rgba(43,140,193,0.35); }
  .navitem.active { color:#8fd0ff; background:rgba(43,140,193,0.12); border-color:#2B8CC1; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>

<body class="font-sans text-slate-200 antialiased">
<div class="flex h-screen overflow-hidden">

  <!-- ─── Sidebar ──────────────────────────────────────────────────────────── -->
  <aside class="flex w-72 flex-none flex-col border-r border-white/10 bg-ink-850">
    <div class="border-b border-white/10 px-5 py-4">
      <div class="font-hud text-sm tracking-wide text-slate-100">DVR&nbsp;Extraction&nbsp;Notes</div>
      <div class="font-mono text-[10px] uppercase tracking-[0.2em] text-carolina/80">Marketing copy</div>
    </div>
    <nav id="sidebar" class="flex-1 overflow-y-auto px-3 py-4"></nav>
    <div class="border-t border-white/10 px-5 py-2 font-mono text-[10px] text-slate-500">
      <span id="edited-count" class="text-cyan">0</span> / <span id="total-count">0</span> fields edited
    </div>
  </aside>

  <!-- ─── Main ─────────────────────────────────────────────────────────────── -->
  <div class="flex flex-1 flex-col overflow-hidden">
    <header class="flex flex-none items-center gap-4 border-b border-white/10 bg-ink-900/85 px-6 py-3 backdrop-blur">
      <div class="mr-auto">
        <div id="crumb" class="font-mono text-[11px] uppercase tracking-[0.15em] text-carolina">—</div>
        <h1 id="section-title" class="font-hud text-lg tracking-wide text-slate-100">Marketing copy</h1>
      </div>
      <button id="btn-reset" class="rounded border border-white/10 px-3 py-1.5 font-mono text-[11px] uppercase tracking-wider text-slate-400 transition hover:border-white/25 hover:text-slate-200">Reset all</button>
      <button id="btn-export" class="rounded bg-carolina px-4 py-1.5 font-mono text-[11px] font-medium uppercase tracking-wider text-ink-900 transition hover:brightness-110">Export changes ↓ .md</button>
    </header>

    <main id="pane" class="flex-1 overflow-y-auto px-6 py-8"></main>

    <!-- export tray -->
    <section id="tray" class="hidden flex-none border-t border-white/10 bg-ink-850/95 px-6 py-4 backdrop-blur">
      <div class="mb-2 flex flex-wrap items-center gap-3">
        <span class="mr-auto font-mono text-[12px] uppercase tracking-wider text-cyan">Export preview</span>
        <button id="btn-copy-md" class="rounded border border-white/15 px-3 py-1.5 font-mono text-[11px] uppercase tracking-wider text-slate-300 transition hover:border-white/30 hover:text-white">Copy .md</button>
        <button id="btn-copy-json" class="rounded border border-white/15 px-3 py-1.5 font-mono text-[11px] uppercase tracking-wider text-slate-300 transition hover:border-white/30 hover:text-white" title="A JSON snapshot of your current edits (round-trip safety net).">Copy JSON snapshot</button>
        <button id="btn-download" class="rounded bg-carolina px-3 py-1.5 font-mono text-[11px] font-medium uppercase tracking-wider text-ink-900 transition hover:brightness-110">Download .md</button>
        <button id="btn-close-tray" class="rounded px-2 py-1.5 font-mono text-[13px] text-slate-400 hover:text-white">✕</button>
      </div>
      <textarea id="preview" readonly class="h-40 w-full rounded border border-white/10 bg-ink-900 p-3 font-mono text-[12px] leading-relaxed text-slate-300"></textarea>
      <p id="toast" class="mt-1 h-4 font-mono text-[11px] text-cyan"></p>
    </section>
  </div>
</div>

<script>
const COPY = /*__COPY_JSON__*/;

const $ = (s, el = document) => el.querySelector(s);
const make = (tag, cls, props = {}) => Object.assign(document.createElement(tag), cls ? { className: cls } : {}, props);

// flat index of every field + baseline/current value stores
const FIELDS = {};        // path -> { field, page, section }
const baseline = {};      // path -> original value
const values = {};        // path -> current (edited) value
for (const page of COPY.pages) for (const section of page.sections) for (const f of section.fields) {
  FIELDS[f.path] = { field: f, page, section };
  baseline[f.path] = f.value;
  values[f.path] = f.value;
}
const allPaths = Object.keys(FIELDS);
$('#total-count').textContent = String(allPaths.length);

let active = { page: COPY.pages[0].id, section: COPY.pages[0].sections[0].id };

// ── sidebar ────────────────────────────────────────────────────────────────
function renderSidebar() {
  const nav = $('#sidebar');
  nav.textContent = '';
  for (const page of COPY.pages) {
    nav.append(make('div', 'mb-1 mt-3 px-2 font-mono text-[10px] uppercase tracking-[0.2em] text-slate-500', { textContent: page.label }));
    for (const section of page.sections) {
      const edits = section.fields.filter((f) => values[f.path] !== baseline[f.path]).length;
      const btn = make('button', 'navitem flex w-full items-center gap-2 rounded border border-transparent px-3 py-1.5 text-left text-[13px] text-slate-400 transition hover:text-slate-100', { type: 'button' });
      if (active.page === page.id && active.section === section.id) btn.classList.add('active');
      btn.append(make('span', 'flex-1 truncate', { textContent: section.label }));
      if (edits) btn.append(make('span', 'font-mono text-[10px] text-cyan', { textContent: '●' + edits }));
      btn.addEventListener('click', () => { active = { page: page.id, section: section.id }; render(); });
      nav.append(btn);
    }
  }
}

// ── main pane ────────────────────────────────────────────────────────────────
function activeSection() {
  const page = COPY.pages.find((p) => p.id === active.page);
  return { page, section: page.sections.find((s) => s.id === active.section) };
}
function renderPane() {
  const { page, section } = activeSection();
  $('#crumb').textContent = page.label;
  $('#section-title').textContent = section.label;
  const pane = $('#pane');
  pane.textContent = '';
  const wrap = make('div', 'mx-auto max-w-3xl space-y-6');

  for (const f of section.fields) {
    const card = make('div', 'rounded-lg border border-white/10 bg-ink-800/60 p-4');
    const head = make('div', 'mb-1.5 flex items-baseline gap-2');
    head.append(make('span', 'font-mono text-[11px] uppercase tracking-[0.12em] text-carolina', { textContent: f.label }));
    head.append(make('span', 'ml-auto font-mono text-[10px] text-slate-600', { textContent: f.path }));
    card.append(head);

    // on-file reference (baseline)
    const ref = make('div', 'mb-2 whitespace-pre-wrap rounded border-l-2 border-white/10 bg-black/25 px-3 py-2 text-[13px] leading-relaxed text-slate-500', { textContent: baseline[f.path] || '— empty —' });
    card.append(ref);

    // editable
    const ctl = make(f.multiline ? 'textarea' : 'input', 'field w-full rounded border border-white/12 bg-ink-900 px-3 py-2 text-[14px] leading-relaxed text-slate-100', { value: values[f.path] });
    if (f.multiline) ctl.rows = Math.min(8, Math.max(2, String(values[f.path]).length / 60 | 0 + 2)); else ctl.type = 'text';
    ctl.setAttribute('aria-label', section.label + ' — ' + f.label);
    ctl.addEventListener('input', () => { values[f.path] = ctl.value; refreshCounts(); });
    card.append(ctl);
    wrap.append(card);
  }
  pane.append(wrap);
  pane.scrollTop = 0;
}
function render() { renderSidebar(); renderPane(); }
function refreshCounts() {
  $('#edited-count').textContent = String(allPaths.filter((p) => values[p] !== baseline[p]).length);
  // update sidebar edit badges without losing focus in the pane
  renderSidebar();
}

// ── export ────────────────────────────────────────────────────────────────
// Export ONLY the fields that changed, as Was/Now blocks — the baseline is the
// source copy baked in at build, so this is the exact delta to apply back.
function toMarkdown() {
  const changed = allPaths.filter((p) => values[p] !== baseline[p]);
  const out = [
    '# DVR Extraction Notes — Marketing copy edits',
    `<!-- ${changed.length} changed field(s). [path] = source location; apply each "Now" in place of "Was". -->`,
    '',
  ];
  if (!changed.length) { out.push('_No changes yet — edit a field, then export._', ''); return out.join('\n'); }
  for (const page of COPY.pages) for (const section of page.sections) {
    const fields = section.fields.filter((f) => values[f.path] !== baseline[f.path]);
    if (!fields.length) continue;
    out.push(`## ${page.label} · ${section.label}`, '');
    for (const f of fields) {
      out.push(
        `### ${f.label}  ·  [${f.path}]`, '',
        '**Was:**', '', baseline[f.path] || '_(empty)_', '',
        '**Now:**', '', values[f.path] || '_(empty)_', '',
        '---', '',
      );
    }
  }
  return out.join('\n');
}
function toJsonSnapshot() {
  const snap = JSON.parse(JSON.stringify(COPY));
  for (const page of snap.pages) for (const s of page.sections) for (const f of s.fields) f.value = values[f.path];
  return JSON.stringify(snap, null, 2);
}
function toast(m) { const t = $('#toast'); t.textContent = m; clearTimeout(toast._t); toast._t = setTimeout(() => (t.textContent = ''), 2600); }
async function copyText(str, label) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(str); toast(label + ' copied ✓'); return; } throw 0; }
  catch { const ta = $('#preview'); ta.value = str; ta.focus(); ta.select(); document.execCommand && document.execCommand('copy'); toast(label + ' copied ✓'); }
}
function download(str) {
  const url = URL.createObjectURL(new Blob([str], { type: 'text/markdown;charset=utf-8' }));
  const a = make('a', null, { href: url, download: 'marketing-copy-changes.md' });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ── wire up ────────────────────────────────────────────────────────────────
$('#btn-export').addEventListener('click', () => { $('#preview').value = toMarkdown(); $('#tray').classList.remove('hidden'); });
$('#btn-close-tray').addEventListener('click', () => $('#tray').classList.add('hidden'));
$('#btn-download').addEventListener('click', () => { download(toMarkdown()); toast('Downloaded marketing-copy-changes.md ✓'); });
$('#btn-copy-md').addEventListener('click', () => copyText(toMarkdown(), 'Markdown'));
$('#btn-copy-json').addEventListener('click', () => copyText(toJsonSnapshot(), 'JSON snapshot'));
$('#btn-reset').addEventListener('click', () => {
  if (!confirm('Reset every field back to the current site copy?')) return;
  for (const p of allPaths) values[p] = baseline[p];
  render();
});

render();
</script>
</body>
</html>
